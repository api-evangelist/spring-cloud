description: Spring Cloud is an Apache 2.0 open-source project under the Spring portfolio (VMware Tanzu / Broadcom). The libraries themselves are free; there is no SaaS endpoint, no API key issuance, and no published per-call pricing. Commercial relationships exist only as paid support via VMware Tanzu Spring (Broadcom) subscriptions.
