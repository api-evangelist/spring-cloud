naftiko: 1.0.0-alpha2
info:
  label: Spring Cloud Gateway Actuator API — Routes
  description: 'Spring Cloud Gateway Actuator API — Routes. 6 operations. Lead operation: Spring Cloud Refresh the routes
    cache. Self-contained Naftiko capability covering one Spring Cloud business surface.'
  tags:
  - Spring Cloud
  - Routes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_CLOUD_API_KEY: SPRING_CLOUD_API_KEY
capability:
  consumes:
  - type: http
    namespace: gateway-actuator-routes
    baseUri: http://localhost:8080/actuator/gateway
    description: Spring Cloud Gateway Actuator API — Routes business capability. Self-contained, no shared references.
    resources:
    - name: refresh
      path: /refresh
      operations:
      - name: refreshroutes
        method: POST
        description: Spring Cloud Refresh the routes cache
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: routes
      path: /routes
      operations:
      - name: getroutes
        method: GET
        description: Spring Cloud List all gateway routes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createroute
        method: POST
        description: Spring Cloud Create a new route definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: routes-id
      path: /routes/{id}
      operations:
      - name: getroute
        method: GET
        description: Spring Cloud Get a specific route definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: updateroute
        method: PUT
        description: Spring Cloud Update a route definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteroute
        method: DELETE
        description: Spring Cloud Delete a route definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
  exposes:
  - type: rest
    namespace: gateway-actuator-routes-rest
    port: 8080
    description: REST adapter for Spring Cloud Gateway Actuator API — Routes. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/refresh
      name: refresh
      description: REST surface for refresh.
      operations:
      - method: POST
        name: refreshroutes
        description: Spring Cloud Refresh the routes cache
        call: gateway-actuator-routes.refreshroutes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/routes
      name: routes
      description: REST surface for routes.
      operations:
      - method: GET
        name: getroutes
        description: Spring Cloud List all gateway routes
        call: gateway-actuator-routes.getroutes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createroute
        description: Spring Cloud Create a new route definition
        call: gateway-actuator-routes.createroute
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/routes/{id}
      name: routes-id
      description: REST surface for routes-id.
      operations:
      - method: GET
        name: getroute
        description: Spring Cloud Get a specific route definition
        call: gateway-actuator-routes.getroute
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateroute
        description: Spring Cloud Update a route definition
        call: gateway-actuator-routes.updateroute
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteroute
        description: Spring Cloud Delete a route definition
        call: gateway-actuator-routes.deleteroute
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gateway-actuator-routes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Cloud Gateway Actuator API — Routes. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: spring-cloud-refresh-routes-cache
      description: Spring Cloud Refresh the routes cache
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: gateway-actuator-routes.refreshroutes
      outputParameters:
      - type: object
        mapping: $.
    - name: spring-cloud-list-all-gateway
      description: Spring Cloud List all gateway routes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gateway-actuator-routes.getroutes
      outputParameters:
      - type: object
        mapping: $.
    - name: spring-cloud-create-new-route
      description: Spring Cloud Create a new route definition
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: gateway-actuator-routes.createroute
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: spring-cloud-get-specific-route
      description: Spring Cloud Get a specific route definition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gateway-actuator-routes.getroute
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: spring-cloud-update-route-definition
      description: Spring Cloud Update a route definition
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: gateway-actuator-routes.updateroute
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: spring-cloud-delete-route-definition
      description: Spring Cloud Delete a route definition
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: gateway-actuator-routes.deleteroute
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
