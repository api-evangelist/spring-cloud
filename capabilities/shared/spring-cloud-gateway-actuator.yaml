naftiko: "1.0.0-alpha1"

info:
  label: "Spring Cloud Gateway"
  description: "API gateway routing and management capabilities using Spring Cloud Gateway Actuator endpoints for runtime route management."
  tags:
    - Spring Cloud
    - API Gateway
    - Route Management
    - Microservices
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SPRING_GATEWAY_BASE_URL: SPRING_GATEWAY_BASE_URL

capability:
  consumes:
    - type: http
      namespace: gateway
      baseUri: "{{SPRING_GATEWAY_BASE_URL}}/actuator/gateway"
      description: "Spring Cloud Gateway Actuator for runtime route management"
      resources:
        - name: routes
          path: /routes
          description: "Gateway route definitions"
          operations:
            - name: list-routes
              method: GET
              description: "List all configured gateway routes"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-route
              method: POST
              description: "Create a new gateway route"
              body:
                type: json
                data:
                  id: "{{tools.routeId}}"
                  uri: "{{tools.uri}}"
                  predicates: "{{tools.predicates}}"
                  filters: "{{tools.filters}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-route
              method: GET
              description: "Get route by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Route identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-route
              method: DELETE
              description: "Delete a gateway route"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Route identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: refresh-routes
              method: POST
              description: "Refresh the routes cache"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8130
      namespace: spring-cloud-gateway-mgmt-api
      resources:
        - path: /v1/routes
          name: routes
          description: "Gateway route management"
          operations:
            - method: GET
              name: list-routes
              description: "List all gateway routes"
              call: "gateway.list-routes"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-route
              description: "Create gateway route"
              call: "gateway.create-route"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9130
      namespace: spring-cloud-gateway-mgmt-mcp
      transport: http
      tools:
        - name: list-gateway-routes
          description: "List all Spring Cloud Gateway routes"
          hints:
            readOnly: true
          call: "gateway.list-routes"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-gateway-route
          description: "Create a new Spring Cloud Gateway route"
          hints:
            readOnly: false
            destructive: false
          call: "gateway.create-route"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-gateway-route
          description: "Delete a Spring Cloud Gateway route by ID"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "gateway.delete-route"
          with:
            id: "tools.routeId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: refresh-gateway-routes
          description: "Refresh the gateway route cache"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "gateway.refresh-routes"
          outputParameters:
            - type: object
              mapping: "$."
