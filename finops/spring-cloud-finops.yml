specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Spring Cloud
providerId: spring-cloud
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Cloud Native
  - Distributed Systems
  - Java
  - Microservices
  - Spring Framework
  - FinOps
  - FOCUS
description: Spring Cloud is open-source self-hosted software with no vendor invoice. FinOps applies only to the cloud infrastructure that runs Spring Cloud components (Config Server, Gateway, Eureka, etc.) and to optional VMware Tanzu Spring / Broadcom commercial support contracts.
sources:
  - https://spring.io/projects/spring-cloud
  - https://tanzu.vmware.com/spring-runtime
notes: No vendor usage meter. FinOps signal lives in the operator's own cloud-provider invoice and any Tanzu Spring support contract.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Broadcom (VMware Tanzu)
serviceCategory: Developer Tools
billingModel:
  pricingCategory: Open Source
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Spring Cloud
  ServiceCategory: Developer Tools
  ProviderName: Spring Cloud
  PublisherName: Broadcom
  InvoiceIssuerName: Broadcom
  BillingCurrency: USD
meters:
  - name: spring_runtime_subscription
    unit: month
    aggregation: sum
    dimensions:
      - contract_tier
      - cores
principles:
  - name: Visibility
    description: Spring Cloud emits Micrometer metrics (request counts, gateway timings, circuit breaker state) that operators ship to their observability stack. Vendor cost is visible only on the Tanzu Spring / Broadcom invoice line.
  - name: Allocation
    description: Allocate the underlying compute footprint of Config Server, Gateway, Eureka, etc. by team via cloud provider tags. The Tanzu support subscription is typically a single platform-org line, not chargeable per consuming team.
  - name: Optimization
    description: Cost levers are infrastructure-side - consolidate Config Server and Eureka into shared platform clusters, autoscale Gateway pods on RPS, and use Resilience4j to shed load before it hits paid downstream APIs.
  - name: Accountability
    description: Platform/SRE team owns Spring Cloud control-plane spend; product teams own the cost of their own Spring Boot services that consume it.
maintainers:
  - name: VMware Tanzu / Broadcom
    url: https://tanzu.vmware.com/spring-runtime
