specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Spring Cloud
providerId: spring-cloud
publisherName: Spring Cloud
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Circuit Breaker
  - Cloud Native
  - Distributed Systems
  - Java
  - Microservices
  - Service Discovery
  - Spring Framework
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Spring Cloud API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Spring Cloud
  ServiceCategory: Developer Tools / API
  ProviderName: Spring Cloud
  PublisherName: Spring Cloud
  InvoiceIssuerName: Spring Cloud
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Spring Cloud Config
    baseURL: http://localhost:8888
    tags:
      - Configuration
      - Distributed Config
      - Git
      - Microservices
    serviceName: Spring Cloud Config
    serviceCategory: API
  - name: Spring Cloud Netflix Eureka
    baseURL: http://localhost:8761
    tags:
      - Eureka
      - Registry
      - Service Discovery
    serviceName: Spring Cloud Netflix Eureka
    serviceCategory: API
  - name: Spring Cloud Gateway
    baseURL: http://localhost:8080
    tags:
      - API Gateway
      - Filtering
      - Load Balancing
      - Routing
    serviceName: Spring Cloud Gateway
    serviceCategory: API
  - name: Spring Cloud Stream
    baseURL: https://spring.io/projects/spring-cloud-stream
    tags:
      - Event-Driven
      - Kafka
      - Messaging
      - RabbitMQ
    serviceName: Spring Cloud Stream
    serviceCategory: API
  - name: Spring Cloud Circuit Breaker
    baseURL: https://spring.io/projects/spring-cloud-circuitbreaker
    tags:
      - Circuit Breaker
      - Fault Tolerance
      - Resilience
      - Resilience4J
    serviceName: Spring Cloud Circuit Breaker
    serviceCategory: API
  - name: Spring Cloud OpenFeign
    baseURL: https://spring.io/projects/spring-cloud-openfeign
    tags:
      - Declarative Client
      - Feign
      - HTTP
      - REST Client
    serviceName: Spring Cloud OpenFeign
    serviceCategory: API
  - name: Spring Cloud Kubernetes
    baseURL: https://spring.io/projects/spring-cloud-kubernetes
    tags:
      - ConfigMap
      - Container Orchestration
      - Kubernetes
      - Service Discovery
    serviceName: Spring Cloud Kubernetes
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: VMware Tanzu (Spring Team)
    email: support@vmware.com
    url: https://spring.io/team
