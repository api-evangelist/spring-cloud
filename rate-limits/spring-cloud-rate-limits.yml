specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Spring Cloud
providerId: spring-cloud
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Circuit Breaker
  - Cloud Native
  - Distributed Systems
  - Java
  - Microservices
  - Service Discovery
  - Spring Framework
  - Rate Limiting
description: Spring Cloud is a set of self-hosted libraries (Config Server, Gateway, Eureka, etc.) — there is no vendor-hosted API and therefore no vendor-imposed throughput limits. Operators define their own throttling using Spring Cloud Gateway's RequestRateLimiter filter (Redis-backed token bucket) or Resilience4j RateLimiter. Numeric limits are entirely operator-determined.
sources:
  - https://spring.io/projects/spring-cloud
  - https://docs.spring.io/spring-cloud-gateway/docs/current/reference/html/#the-requestratelimiter-gatewayfilter-factory
notes: No vendor-imposed rate limits. Spring Cloud Gateway and Resilience4j provide the building blocks; effective limits are whatever the operator configures.
responseCodes:
  throttled: 429
limits:
  - name: Operator-Defined (Spring Cloud Gateway / Resilience4j)
    scope: deployment
    metric: varies
    limit: see operator gateway and Resilience4j configuration
    notes: Effective limits depend on the RequestRateLimiter filter (replenishRate, burstCapacity) or Resilience4j RateLimiter configuration the operator deploys.
policies:
  - name: Self-Hosted Throttling
    description: Spring Cloud Gateway emits a 429 with Retry-After when the configured token bucket is empty. Resilience4j RateLimiter throws a RequestNotPermitted exception that the application maps to 429. Both are configured per-route by the operator.
  - name: Distributed Coordination
    description: Multi-instance deployments require a shared store (Redis is the documented default for Spring Cloud Gateway's RequestRateLimiter) so the bucket is consistent across replicas.
maintainers:
  - name: VMware Tanzu / Broadcom
    url: https://tanzu.vmware.com/spring-runtime
